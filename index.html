<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="GOA1 — suivi d'objectifs, assessment quotidien en une minute">
  <title>GOA1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <span class="brand">GOA<b>1</b></span>
    <span id="title" class="title"></span>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Aujourd'hui</button>
    <button data-tab="bilan"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Bilan</button>
    <button data-tab="objectifs"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>Objectifs</button>
    <button data-tab="plus"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/></svg>Plus</button>
  </nav>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-action="close-sheet"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
